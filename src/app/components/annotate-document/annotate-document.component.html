<div class="my-2">
  

  <div cdkDropList cdkDropListSortingDisabled (cdkDropListDropped)="suggestionDropped($event.item)" class="flex align-items-start gap-2 mt-2 mb-4 flex-wrap">
    <p class="m-0 mb-2 w-full" *ngIf="bokConcepts.length === 0">
      Add knowledge manually or use the AI suggested concepts to start annotating the PDF
    </p>
    <ng-container *ngFor="let concept of bokConcepts">
      <p-chip [label]="'[' + concept + '] ' + (getConceptName(concept) | async)" [removable]="true" [style.background]="getBackgroundColor(concept) | async" (onRemove)="deleteBokConcept(concept)" 
      [style.color]="'var(--primary-color)'" [style]="{'--p-chip-remove-icon-color':'var(--primary-color)'}" class="lg:white-space-nowrap" />
    </ng-container>
  </div>

  <div class="flex flex-wrap gap-2">
    <p-button
      class="custom-button"
      (click)="onClear()"
      [disabled]="!isPdfAvailable || bokConcepts.length == 0"
    >
      Clear all
    </p-button>
  </div>
</div>
